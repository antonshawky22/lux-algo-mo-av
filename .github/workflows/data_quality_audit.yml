name: EGX Data Quality Audit

on:

  workflow_dispatch:

  push:
    paths:
      - "egx_history_database_v2.json"
      - "data_quality_audit.py"

jobs:

  audit:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Python
      # ------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------
      # Run audit
      # ------------------------------------------

      - name: Run Data Quality Audit
        run: |
          python data_quality_audit.py

      # ------------------------------------------
      # Commit results
      # ------------------------------------------

      - name: Commit audit files
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            egx_history_database_clean.json \
            corporate_actions_audit.json

          git diff --cached --quiet || \
            git commit -m "Run EGX data quality audit"

          git push
